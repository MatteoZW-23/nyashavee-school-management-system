<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Nyashavee</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f4; font-family: ui-sans-serif, system-ui, sans-serif; }
  .card { max-width: 26rem; background: #fff; border: 1px solid #dce4df; border-radius: 1rem; padding: 2.5rem; text-align: center; }
  h1 { color: #173329; font-size: 1.4rem; margin: 1rem 0 0; }
  p { color: #68776f; font-size: 0.875rem; line-height: 1.6; }
  .dot { width: 3rem; height: 3rem; margin: 0 auto; border-radius: 50%; background: #fbf0df; display: grid; place-items: center; font-size: 1.4rem; }
  button { margin-top: 1rem; background: #173f35; color: #fff; border: 0; border-radius: 0.5rem; padding: 0.6rem 1.2rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">📶</div>
    <h1>Cannot reach the school server</h1>
    <p>The connection to the Nyashavee server was lost — check the school network or that the server computer is switched on. Any changes you submit will queue and sync when it reconnects.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
